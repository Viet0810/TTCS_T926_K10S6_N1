<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hồ sơ cá nhân | Hệ thống quản lý thực tập sinh</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/style.css" /><link rel="stylesheet" href="../css/auth.css" />
  </head>
  <body>
    <div class="dashboard">
      <header class="dashboard-header">
        <div class="dashboard-brand">
          <div class="dashboard-logo"><img src="../assets/codegym-logo.webp" alt="CODEGYM" width="1437" height="312"></div>
          <div class="dashboard-title">
            <span>HỆ THỐNG QUẢN LÝ THỰC TẬP SINH</span>
            <h1>Hồ sơ cá nhân</h1>
          </div>
        </div>
        <div class="dashboard-session">

          <a class="btn-secondary topbar-dashboard-link" href="dashboard.html">Bảng điều khiển</a>
<button type="button" id="logoutBtn" class="btn-danger">
            Đăng xuất
          </button>
        </div>
      </header>
      <nav id="roleMenu" class="role-menu" aria-label="Điều hướng chính"></nav>
      <main class="dashboard-main">
        <section class="card">
          <div class="section-heading">
            <div>
              <span class="section-label">HỒ SƠ TÀI KHOẢN</span>
              <h2 id="profileName">Đang tải...</h2>
              <p>Thông tin lấy từ phiên đăng nhập đã xác thực.</p>
            </div>
            <span id="profileRole" class="badge"></span>
          </div>
          <dl class="profile-details">
            <div>
              <dt>Email</dt>
              <dd id="profileEmail"></dd>
            </div>
            <div>
              <dt>Tên đăng nhập</dt>
              <dd id="profileUsername"></dd>
            </div>
            <div>
              <dt>Vai trò</dt>
              <dd id="profileRoleName"></dd>
            </div>
          </dl>
          <section id="ownProfile" hidden>
            <h3>Thông tin cá nhân</h3>
            <dl id="ownProfileDetails" class="profile-details"></dl>
            <button id="editProfileBtn" type="button" class="btn-primary">Chỉnh sửa thông tin</button>
            <form id="ownProfileForm" class="form-grid" novalidate hidden>
              <div class="auth-field"><label for="ownFullName">Họ và tên</label><input id="ownFullName" maxlength="200" required aria-describedby="ownFullNameError" placeholder="Nhập họ và tên"><small id="ownFullNameError" class="auth-field-error" role="alert" hidden></small></div>
              <div class="auth-field"><label for="ownPhone">Số điện thoại</label><input id="ownPhone" type="tel" maxlength="10" required aria-describedby="ownPhoneError" placeholder="Nhập số điện thoại"><small id="ownPhoneError" class="auth-field-error" role="alert" hidden></small></div>
              <div class="auth-field"><label for="ownSchool">Trường</label><input id="ownSchool" maxlength="200" required aria-describedby="ownSchoolError" placeholder="Nhập tên trường"><small id="ownSchoolError" class="auth-field-error" role="alert" hidden></small></div>
              <div class="auth-field"><label for="ownMajor">Chuyên ngành</label><input id="ownMajor" maxlength="200" required aria-describedby="ownMajorError" placeholder="Nhập chuyên ngành"><small id="ownMajorError" class="auth-field-error" role="alert" hidden></small></div>
              <div class="auth-field"><label for="ownAddress">Địa chỉ</label><input id="ownAddress" maxlength="500" aria-describedby="ownAddressError" placeholder="Nhập địa chỉ"><small id="ownAddressError" class="auth-field-error" role="alert" hidden></small></div>
              <div class="form-actions"><button id="saveProfileBtn" type="submit" class="btn-primary">Lưu thay đổi</button><button id="cancelProfileBtn" type="button" class="btn-secondary">Hủy</button></div>
            </form>
          </section>
          <p id="profileMessage" class="dashboard-message" role="status"></p>
        </section>
      </main>
      <footer class="dashboard-footer">© 2026 Hệ thống quản lý thực tập sinh</footer>
    </div>
    <script src="../js/api.js"></script><script src="../js/navigation.js"></script>
    <script src="../js/validation.js"></script>
    <script src="../js/profile.js"></script>
  </body>
</html>
