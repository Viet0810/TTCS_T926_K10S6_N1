<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duyệt đơn nghỉ | Hệ thống quản lý thực tập sinh</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/style.css?v=20261022-13">
  <link rel="stylesheet" href="../css/visuals.css">
  <link rel="stylesheet" href="../css/ui.css">
  <link rel="stylesheet" href="../css/tables.css?v=20261022-7">
  <link rel="stylesheet" href="../css/leave-request.css">
</head>
<body>
  <div class="dashboard">
    <header class="dashboard-header">
      <div class="dashboard-brand"><div class="dashboard-logo"><img src="../assets/codegym-logo.webp" alt="CODEGYM"></div><div class="dashboard-title"><span>HỆ THỐNG QUẢN LÝ THỰC TẬP SINH</span><h1>Duyệt đơn nghỉ</h1></div></div>
      <div class="dashboard-session"><a class="btn-secondary topbar-dashboard-link" href="dashboard.html">Bảng điều khiển</a><button id="logoutBtn" type="button" class="btn-danger">Đăng xuất</button></div>
    </header>
    <nav id="roleMenu" class="role-menu" aria-label="Điều hướng chính"></nav>
    <main class="dashboard-main">
      <section class="card">
        <div class="section-heading"><div><span class="section-label">MENTOR</span><h2>Đơn nghỉ của Intern đang hướng dẫn</h2><p>Chỉ hiển thị đơn của Intern đang được phân công cho bạn.</p></div></div>
        <div class="leave-filters-bar">
          <div class="filter-tabs" aria-label="Lọc trạng thái">
            <button class="filter-tab active" data-status="ALL" type="button">Tất cả</button>
            <button class="filter-tab" data-status="PENDING" type="button">Chờ duyệt</button>
            <button class="filter-tab" data-status="APPROVED" type="button">Đã duyệt</button>
            <button class="filter-tab" data-status="REJECTED" type="button">Từ chối</button>
          </div>
          <button id="refreshLeaveBtn" class="btn-secondary" type="button">Tải lại</button>
        </div>
        <div class="table-scroll"><table class="user-table"><thead><tr><th>Intern</th><th>Thời gian</th><th>Lý do</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody id="mentorLeaveBody"></tbody></table></div>
      </section>
    </main>
  </div>
  <div id="reviewModal" class="modal-overlay" hidden>
    <section class="modal-card mentor-review-card" role="dialog" aria-modal="true" aria-labelledby="reviewTitle">
      <div class="modal-header"><h2 id="reviewTitle" class="modal-title">Chi tiết đơn nghỉ</h2></div>
      <div id="reviewDetail" class="mentor-review-detail"></div>
      <label for="reviewNote">Ghi chú phản hồi</label>
      <textarea id="reviewNote" class="form-control" maxlength="1000" rows="3" placeholder="Nhập lý do nếu từ chối"></textarea>
      <div class="modal-actions"><button id="closeReviewBtn" class="btn-secondary" type="button">Đóng</button><button id="rejectLeaveBtn" class="btn-danger" type="button">Từ chối</button><button id="approveLeaveBtn" class="btn-primary" type="button">Duyệt</button></div>
    </section>
  </div>
  <script src="../js/api.js?v=mentor-leave-review-1"></script><script src="../js/ui.js"></script><script src="../js/visuals.js"></script><script src="../js/navigation.js?v=20261022-15"></script><script src="../js/mentor-leave-requests.js?v=mentor-leave-review-1"></script>
</body>
</html>
