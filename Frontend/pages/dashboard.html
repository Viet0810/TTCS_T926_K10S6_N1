<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bảng điều khiển | Hệ thống quản lý thực tập sinh</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="dashboard">
      <header class="dashboard-header">
        <div class="dashboard-brand">
          <div class="dashboard-logo"><img src="../assets/codegym-logo.webp" alt="CODEGYM" width="1437" height="312"></div>
          <div class="dashboard-title">
            <span>HỆ THỐNG QUẢN LÝ THỰC TẬP SINH</span>
            <h1>Bảng điều khiển</h1>
          </div>
        </div>
        <div class="dashboard-session">
          <span id="roleBadge" class="badge"></span>
          <button type="button" id="logoutBtn" class="btn-danger">
            Đăng xuất
          </button>
        </div>
      </header>

      <nav
        id="roleMenu"
        class="role-menu"
        aria-label="Chức năng theo vai trò"
      ></nav>

      <main class="dashboard-main">
        <section class="card">
          <div class="section-heading">
            <div>
              <span class="section-label">XIN CHÀO</span>
              <h2 id="welcomeTitle">Đang tải lời chào…</h2>
            </div>
          </div>
          <p id="dashboardMessage" class="dashboard-message" role="status" hidden></p>
        </section>
      </main>
      <footer class="dashboard-footer">© 2026 Hệ thống quản lý thực tập sinh</footer>
    </div>
    <script src="../js/api.js"></script>
    <script src="../js/dashboard.js"></script>
    <script src="../js/notifications.js"></script>
  </body>
</html>
