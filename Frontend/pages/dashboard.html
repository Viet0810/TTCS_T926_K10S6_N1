<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bảng điều khiển | Intern Management System</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="dashboard">
      <header class="dashboard-header">
        <div class="dashboard-brand">
          <div class="dashboard-logo">IM</div>
          <div class="dashboard-title">
            <span>INTERN MANAGEMENT SYSTEM</span>
            <h1>Bảng điều khiển</h1>
          </div>
        </div>
        <div class="dashboard-session">
          <span id="roleBadge" class="badge"></span>
          <button type="button" id="logoutBtn" class="btn-danger">
            Đăng xuất
          </button>
        </div>
      </header>

      <nav
        id="roleMenu"
        class="role-menu"
        aria-label="Chức năng theo vai trò"
      ></nav>

      <main class="dashboard-main">
        <section class="card">
          <div class="section-heading">
            <div>
              <span class="section-label">XIN CHÀO</span>
              <h2 id="welcomeTitle">Bảng điều khiển</h2>
              <p id="welcomeDescription">Đang tải quyền truy cập...</p>
            </div>
          </div>
          <h3 class="permission-heading">Chức năng được cấp</h3>
          <ul id="permissionList" class="permission-list"></ul>
          <p id="dashboardMessage" class="dashboard-message" role="status"></p>
        </section>
      </main>
      <footer class="dashboard-footer">© 2026 Intern Management System</footer>
    </div>
    <script src="../js/api.js"></script>
    <script src="../js/dashboard.js"></script>
  </body>
</html>
