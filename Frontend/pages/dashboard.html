<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bảng điều khiển | Hệ thống quản lý thực tập sinh</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="dashboard">
      <header class="dashboard-header">
        <div class="dashboard-brand">
          <div class="dashboard-logo"><img src="../assets/codegym-logo.webp" alt="CODEGYM" width="1437" height="312"></div>
          <div class="dashboard-title">
            <span>HỆ THỐNG QUẢN LÝ THỰC TẬP SINH</span>
            <h1>Bảng điều khiển</h1>
          </div>
        </div>
        <div class="dashboard-session">
          <span id="roleBadge" class="badge"></span>
          <button type="button" id="logoutBtn" class="btn-danger">
            Đăng xuất
          </button>
        </div>
      </header>

      <nav
        id="roleMenu"
        class="role-menu"
        aria-label="Chức năng theo vai trò"
      ></nav>

      <main class="dashboard-main">
        <section class="card">
          <div class="section-heading">
            <div>
              <span class="section-label">XIN CHÀO</span>
              <h2 id="welcomeTitle">Đang tải lời chào…</h2>
            </div>
          </div>
          <p id="dashboardMessage" class="dashboard-message" role="status" hidden></p>
        </section>
        <section id="attendanceCard" class="card" aria-labelledby="attendanceTitle" hidden>
          <div class="section-heading">
            <div>
              <span class="section-label">CHẤM CÔNG</span>
              <h2 id="attendanceTitle">Chấm công hôm nay</h2>
              <p>Ghi nhận thời gian làm việc trong ngày.</p>
            </div>
          </div>
          <dl class="attendance-details">
            <div>
              <dt>Trạng thái</dt>
              <dd id="attendanceStatus">Đang tải…</dd>
            </div>
            <div>
              <dt>Giờ check-in</dt>
              <dd id="attendanceCheckIn">—</dd>
            </div>
            <div>
              <dt>Giờ check-out</dt>
              <dd id="attendanceCheckOut">—</dd>
            </div>
          </dl>
          <p id="attendanceMessage" class="attendance-message" role="status" aria-live="polite" hidden></p>
          <div class="attendance-actions">
            <button type="button" id="checkInBtn" class="btn-primary" disabled>Check-in</button>
            <button type="button" id="checkOutBtn" class="btn-secondary" disabled>Check-out</button>
          </div>
        </section>
      </main>
      <footer class="dashboard-footer">© 2026 Hệ thống quản lý thực tập sinh</footer>
    </div>
   <script src="../js/api.js"></script>
<script src="../js/dashboard.js"></script>
<script src="../js/program-date-setting.js"></script>
</body>
</html>
