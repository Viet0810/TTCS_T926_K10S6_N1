<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thêm Mentor | Hệ thống quản lý thực tập sinh</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/ui.css" />
    <link rel="stylesheet" href="../css/visuals.css" />
  </head>
  <body>
    <div class="dashboard">
      <header class="dashboard-header">
        <div class="dashboard-brand">
          <div class="dashboard-logo"><img src="../assets/codegym-logo.webp" alt="CODEGYM" width="1437" height="312" /></div>
          <div class="dashboard-title">
            <span>HỆ THỐNG QUẢN LÝ THỰC TẬP SINH</span>
            <h1>Thêm Mentor</h1>
          </div>
        </div>
        <div class="dashboard-session">
          <span id="roleBadge" class="badge"></span>
          <a class="btn-secondary topbar-dashboard-link" href="dashboard.html">Bảng điều khiển</a>
          <button type="button" id="logoutBtn" class="btn-danger">Đăng xuất</button>
        </div>
      </header>
      <nav id="roleMenu" class="role-menu" aria-label="Điều hướng chính"></nav>
      <main class="dashboard-main">
        <section class="card">
          <div class="section-heading">
            <div>
              <span class="section-label">QUẢN LÝ MENTOR</span>
              <h2>Tạo tài khoản Mentor</h2>
              <p>Nhập họ tên và email. Mật khẩu tạm sẽ được tạo tự động và gửi qua email.</p>
            </div>
            <div class="section-icon" aria-hidden="true">＋</div>
          </div>
          <p id="mentorAccessMessage" class="inline-notice" role="status" aria-live="polite" hidden></p>
          <form id="createMentorForm" class="create-user-form" hidden>
            <div class="form-group">
              <label for="mentorFullName">Họ và tên</label>
              <input type="text" id="mentorFullName" name="fullName" autocomplete="name" maxlength="200" required />
            </div>
            <div class="form-group">
              <label for="mentorEmail">Email</label>
              <input type="email" id="mentorEmail" name="email" autocomplete="email" maxlength="254" required />
            </div>
            <div class="form-actions">
              <button id="createMentorButton" type="submit" class="btn-primary">Tạo Mentor</button>
            </div>
          </form>
        </section>
      </main>
      <footer class="dashboard-footer">© 2026 Hệ thống quản lý thực tập sinh</footer>
    </div>
    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/visuals.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/mentor-create.js"></script>
  </body>
</html>
