<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý tài khoản | Hệ thống quản lý thực tập sinh</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="dashboard">
      <!-- HEADER -->
      <header class="dashboard-header">
        <div class="dashboard-brand">
          <div class="dashboard-logo"><img src="../assets/codegym-logo.webp" alt="CODEGYM" width="1437" height="312"></div>

          <div class="dashboard-title">
            <span>HỆ THỐNG QUẢN LÝ THỰC TẬP SINH</span>
            <h1>Hệ thống quản lý tài khoản</h1>
          </div>
        </div>

        <div class="dashboard-session"><a class="btn-secondary topbar-dashboard-link" href="dashboard.html">Bảng điều khiển</a>
<button type="button" id="logoutBtn" class="btn-danger">
          <span class="logout-icon">↪</span>
          Đăng xuất
        </button></div>
      </header>
      <nav id="roleMenu" class="role-menu" aria-label="Điều hướng chính"></nav>

      <!-- MAIN CONTENT -->
      <main class="dashboard-main">
        <!-- USER LIST -->
        <section class="card">
          <div class="section-heading user-list-heading">
            <div>
              <span class="section-label">DANH SÁCH</span>
              <h2>Quản lý tài khoản</h2>
              <p>Danh sách tài khoản đang được quản lý trong hệ thống.</p>
            </div>
            <a id="createUserLink" class="btn-primary" href="user-create.html" hidden>+ Tạo tài khoản mới</a>
          </div>

          <div class="user-search">
            <input
              id="userSearchInput"
              type="search"
              placeholder="Tìm theo tên, email hoặc vai trò..."
              aria-label="Tìm tài khoản"
            />
          </div>

          <div class="table-container">
            <table class="user-table">
              <thead>
                <tr>
                  <th>Họ và tên</th>
                  <th>Email</th>
                  <th>Vai trò</th>
                  <th>Hành động</th>
                </tr>
              </thead>

              <tbody id="userTableBody">
                <tr><td colspan="4" class="empty-state">Đang tải tài khoản…</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>

      <footer class="dashboard-footer">© 2026 Hệ thống quản lý thực tập sinh</footer>
    </div>

    <script src="../js/api.js"></script><script src="../js/navigation.js"></script>
    <script src="../js/user-manage.js"></script>
  </body>
</html>
