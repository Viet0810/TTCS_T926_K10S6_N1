<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đổi mật khẩu | Hệ thống quản lý thực tập sinh</title>
  <link rel="stylesheet" href="../css/base.css" /><link rel="stylesheet" href="../css/style.css" /><link rel="stylesheet" href="../css/auth.css" />
</head>
<body>
  <div class="dashboard">
    <header class="dashboard-header">
      <div class="dashboard-brand"><div class="dashboard-logo"><img src="../assets/codegym-logo.webp" alt="CODEGYM" width="1437" height="312" /></div><div class="dashboard-title"><span>HỆ THỐNG QUẢN LÝ THỰC TẬP SINH</span><h1>Đổi mật khẩu</h1></div></div>
      <div class="dashboard-session"><a id="backToProfile" href="profile.html" class="btn-secondary">Hồ sơ cá nhân</a><button id="logoutBtn" type="button" class="btn-danger">Đăng xuất</button></div>
    </header>
    <nav id="roleMenu" class="role-menu" aria-label="Điều hướng chính"></nav>
    <main class="dashboard-main">
      <section class="card">
        <div class="section-heading"><div><span class="section-label">BẢO MẬT TÀI KHOẢN</span><h2>Đổi mật khẩu</h2><p id="changeDescription">Cập nhật mật khẩu để bảo vệ tài khoản của bạn.</p></div></div>
        <form id="changePasswordForm" class="auth-form" novalidate hidden>
          <div class="auth-field"><label for="currentPassword">Mật khẩu hiện tại</label><div class="password-field"><input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" maxlength="200" required placeholder="Nhập mật khẩu hiện tại" aria-describedby="currentPasswordError" /><button type="button" class="password-toggle" data-password-toggle="currentPassword" aria-controls="currentPassword" aria-label="Hiển thị mật khẩu" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="password-eye-slash" d="m4 4 16 16"/></svg></button></div><span id="currentPasswordError" class="auth-field-error" hidden></span></div>
          <div class="auth-field"><label for="newPassword">Mật khẩu mới</label><div class="password-field"><input id="newPassword" name="newPassword" type="password" autocomplete="new-password" maxlength="200" required placeholder="Nhập mật khẩu mới" aria-describedby="newPasswordError" /><button type="button" class="password-toggle" data-password-toggle="newPassword" aria-controls="newPassword" aria-label="Hiển thị mật khẩu" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="password-eye-slash" d="m4 4 16 16"/></svg></button></div><span id="newPasswordError" class="auth-field-error" hidden></span></div>
          <div class="auth-field"><label for="confirmPassword">Xác nhận mật khẩu mới</label><div class="password-field"><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" maxlength="200" required placeholder="Nhập lại mật khẩu mới" aria-describedby="confirmPasswordError" /><button type="button" class="password-toggle" data-password-toggle="confirmPassword" aria-controls="confirmPassword" aria-label="Hiển thị mật khẩu" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="password-eye-slash" d="m4 4 16 16"/></svg></button></div><span id="confirmPasswordError" class="auth-field-error" hidden></span></div>
          <p id="changeMessage" class="auth-message" role="status" aria-live="polite" hidden></p>
          <div class="form-actions"><button type="submit" class="btn-primary">Đổi mật khẩu</button></div>
        </form>
        <p id="loadingMessage" role="status">Đang kiểm tra tài khoản...</p>
      </section>
    </main>
  </div>
  <script src="../js/api.js"></script><script src="../js/navigation.js"></script><script src="../js/validation.js"></script><script src="../js/auth-ui.js"></script><script src="../js/change-password.js"></script>
</body>
</html>
