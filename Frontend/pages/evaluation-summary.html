<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tổng hợp đánh giá</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/style.css?v=20261022-13">
  <link rel="stylesheet" href="../css/visuals.css?v=20261022-2">
  <link rel="stylesheet" href="../css/evaluation-summary.css?v=20261022-3">
</head>
<body>
  <div class="dashboard">
    <header class="dashboard-header">
      <div class="dashboard-brand">
        <div class="dashboard-logo"><img src="../assets/codegym-logo.webp" alt="CODEGYM"></div>
        <div class="dashboard-title"><span>HỆ THỐNG QUẢN LÝ THỰC TẬP SINH</span><h1>Tổng hợp đánh giá</h1></div>
      </div>
      <div class="dashboard-session"><a class="btn-secondary topbar-dashboard-link" href="dashboard.html">Bảng điều khiển</a><button id="logoutBtn" class="btn-danger">Đăng xuất</button></div>
    </header>
    <nav id="roleMenu" class="role-menu"></nav>
    <main class="dashboard-main evaluation-page">
      <section class="card">
        <div class="section-heading">
          <div><h2>HR tổng hợp đánh giá Intern</h2><p>Xem đánh giá của Mentor, chốt và công bố kết quả cuối cùng.</p></div>
          <button id="exportBtn" class="btn-secondary">Xuất CSV</button>
        </div>
        <form id="filters" class="summary-filters">
          <input id="search" type="search" placeholder="Tên, mã hoặc email Intern">
          <select id="program"><option value="">Tất cả chương trình</option></select>
          <select id="mentor"><option value="">Tất cả Mentor</option></select>
          <select id="status"><option value="">Tất cả trạng thái</option><option value="INCOMPLETE">Chưa đủ đánh giá</option><option value="READY">Chờ tổng hợp</option><option value="FINALIZED">Đã chốt</option><option value="PUBLISHED">Đã công bố</option></select>
          <button class="btn-primary">Lọc</button>
        </form>
        <p id="message" role="status">Đang tải dữ liệu…</p>
        <div class="table-container"><table class="user-table"><thead><tr><th>Intern</th><th>Mentor</th><th>Chương trình</th><th>Đánh giá</th><th>Điểm TB</th><th>Xếp loại</th><th>Trạng thái</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
        <div id="pager" class="table-pagination" hidden></div>
      </section>
    </main>
    <footer class="dashboard-footer">© 2026 Hệ thống quản lý thực tập sinh</footer>
  </div>
  <dialog id="detailDialog" class="summary-dialog"><form method="dialog"><button class="dialog-close" aria-label="Đóng">×</button></form><div id="detailContent"></div></dialog>
  <script src="../js/api.js?v=20261022-2"></script>
  <script src="../js/ui.js?v=20261022-2"></script>
  <script src="../js/visuals.js?v=20261022-2"></script>
  <script src="../js/navigation.js?v=20261022-15"></script>
  <script src="../js/evaluation-summary.js?v=20261022-7"></script>
</body>
</html>
