<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lịch làm việc</title><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/style.css?v=20261022-13"><link rel="stylesheet" href="../css/visuals.css"><link rel="stylesheet" href="../css/work-schedules.css?v=20261022-11"><link rel="stylesheet" href="../css/work-schedule-views.css?v=20261022-11"></head><body><div class="dashboard"><header class="dashboard-header"><div class="dashboard-brand"><div class="dashboard-logo"><img src="../assets/codegym-logo.webp" alt="CODEGYM"></div><div class="dashboard-title"><span>HỆ THỐNG QUẢN LÝ THỰC TẬP SINH</span><h1>Lịch làm việc</h1></div></div><div class="dashboard-session"><a class="btn-secondary" href="dashboard.html">Bảng điều khiển</a><button id="logoutBtn" class="btn-danger">Đăng xuất</button></div></header><nav id="roleMenu" class="role-menu"></nav><main class="dashboard-main schedule-page"><p id="scheduleMessage" role="status"></p><section class="card schedule-toolbar"><div><h2>Lịch theo Mentor</h2><p id="readonlyHint"></p></div><div class="view-switch"><button data-view="month">Tháng</button><button data-view="week">Tuần</button><button data-view="day">Ngày</button><button data-view="list" class="active">Danh sách</button></div><button id="createBtn" class="btn-primary">Tạo lịch</button></section><section class="card"><form id="filters" class="schedule-filters"><select id="filterMentor"><option value="">Tất cả Mentor</option></select><select id="filterIntern"><option value="">Tất cả Intern</option></select><select id="filterType"><option value="">Tất cả loại</option><option value="WORK">Làm việc</option><option value="MEETING">Họp</option><option value="TRAINING">Đào tạo</option><option value="OTHER">Khác</option></select><select id="filterStatus"><option value="">Tất cả trạng thái</option><option value="ACTIVE">Hoạt động</option><option value="PAUSED">Tạm dừng</option><option value="CANCELLED">Đã hủy</option></select><input id="filterFrom" type="date"><input id="filterTo" type="date"><button class="btn-secondary">Lọc</button></form><div id="calendar" class="schedule-list"></div></section></main></div><dialog id="editor" class="schedule-dialog"><form id="scheduleForm"><button type="button" class="dialog-close" data-close>×</button><h2 id="formTitle">Tạo lịch theo Mentor</h2><div class="form-grid"><label>Mentor<select id="mentorId" required></select></label><label>Tiêu đề<input id="title" maxlength="200" required></label><label>Loại lịch<select id="scheduleType"><option value="WORK">Làm việc</option><option value="TRAINING">Đào tạo</option><option value="OTHER">Khác</option></select></label><label>Trạng thái<select id="status"><option value="ACTIVE">Hoạt động</option><option value="PAUSED">Tạm dừng</option><option value="CANCELLED">Đã hủy</option></select></label><label>Ngày bắt đầu<input id="startDate" type="date" required></label><label>Ngày kết thúc<input id="endDate" type="date" required></label><label>Giờ bắt đầu<input id="startTime" type="time" value="08:00" required></label><label>Giờ kết thúc<input id="endTime" type="time" value="17:30" required></label><label>Lặp lại<select id="recurrence"><option value="NONE">Không lặp</option><option value="WEEKLY">Hằng tuần</option><option value="CUSTOM">Tùy chỉnh</option></select></label></div><fieldset id="weekdays" hidden><legend>Ngày áp dụng</legend><div class="weekday-grid"></div></fieldset><div><b>Intern áp dụng</b><div id="internRecipients" class="recipient-list">Chọn Mentor để xem danh sách.</div></div><label>Ghi chú<textarea id="note" maxlength="1000"></textarea></label><div id="scopeField" hidden><b>Phạm vi thay đổi</b><label><input type="radio" name="scope" value="THIS"> Chỉ lịch ngày này</label><label><input type="radio" name="scope" value="FUTURE"> Lịch này và các lần sau</label><label><input type="radio" name="scope" value="ALL" checked> Toàn bộ chuỗi lịch</label></div><div class="dialog-actions"><button type="button" class="btn-secondary" data-close>Đóng</button><button class="btn-primary">Lưu lịch</button></div></form></dialog><dialog id="details" class="schedule-dialog"><button class="dialog-close" data-detail-close>×</button><div id="detailBody"></div></dialog><script src="../js/api.js"></script><script src="../js/ui.js"></script><script src="../js/visuals.js"></script><script src="../js/navigation.js?v=20261022-15"></script><script src="../js/work-schedules.js?v=20261022-12"></script></body></html>
