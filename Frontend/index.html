<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập | Hệ thống quản lý Thực tập sinh</title>
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <div class="login-page">
      <div class="login-card">
        <div class="project-brand">
          <div class="project-icon">IM</div>
          <p class="project-subtitle">INTERN MANAGEMENT SYSTEM</p>
          <h1>HỆ THỐNG QUẢN LÝ<br />THỰC TẬP SINH</h1>
          <p class="project-description">
            Nền tảng quản lý và theo dõi quá trình thực tập
          </p>
        </div>

        <div class="login-divider"></div>

        <div class="login-content">
          <h2>Chào mừng trở lại!</h2>
          <p class="login-instruction">Đăng nhập để tiếp tục vào hệ thống</p>

          <form id="loginForm">
            <div class="form-group">
              <label for="username">Email / Tên đăng nhập</label>
              <input
                type="text"
                id="username"
                name="username"
                placeholder="Nhập email hoặc tên đăng nhập"
                autocomplete="username"
                required
              />
            </div>

            <div class="form-group">
              <label for="password">Mật khẩu</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Nhập mật khẩu"
                autocomplete="current-password"
                required
              />
            </div>

            <button type="submit" class="login-button">
              Đăng nhập
              <span aria-hidden="true">→</span>
            </button>
          </form>

          <p class="login-footer">© 2026 Intern Management System</p>
        </div>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
